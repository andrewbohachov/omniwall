[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omniwall"
version = "1.0.0"
description = "Cross-Desktop 4K Wallpaper Rotator for Linux (KDE Plasma, GNOME, XFCE, Wayland, X11)"
readme = "README.md"
authors = [{ name = "OmniWall Developers", email = "chelsea@local" }]
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["wallpaper", "warhammer40k", "linux", "kde", "gnome", "4k"]
classifiers = [
    "Environment :: X11 Applications",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment"
]

[project.scripts]
omniwall = "omniwall:main"
wallpapers = "omniwall:main"
grimwall = "omniwall:main"

[tool.setuptools]
py-modules = ["omniwall"]
